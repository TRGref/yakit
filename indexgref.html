<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yakit Fiyatlari</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d8e0ea;
      --head: #eef3f8;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --warn: #a15c07;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    .page {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      padding: 20px 0 36px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1, h2, p { margin: 0; }

    h1 {
      margin-bottom: 4px;
      font-size: 26px;
      line-height: 1.15;
    }

    h2 {
      font-size: 16px;
      line-height: 1.2;
    }

    .topbar p,
    .summary span { color: var(--muted); }

    .jsonLink {
      min-width: 68px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .jsonLink:hover { background: var(--accent-strong); }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 190px 110px;
      gap: 10px;
      align-items: end;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 12px;
      margin-bottom: 14px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input, select, button {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 0 10px;
      font: inherit;
    }

    button {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--accent-strong); }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary div {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 12px;
    }

    .summary strong {
      display: block;
      margin-bottom: 3px;
      font-size: 22px;
      line-height: 1.1;
    }

    .notice {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--warn);
      padding: 14px;
      margin-bottom: 14px;
      font-weight: 700;
    }

    .cityGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 12px;
    }

    .cityCard {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .cityHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--head);
      border-bottom: 1px solid var(--line);
      padding: 11px 12px;
    }

    .stationRow {
      display: grid;
      grid-template-columns: 86px repeat(3, minmax(0, 1fr));
      gap: 8px;
      align-items: center;
      min-height: 58px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    .stationRow:last-child { border-bottom: 0; }
    .stationName { font-weight: 800; }

    .priceCell {
      display: grid;
      gap: 2px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .priceCell span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .priceCell strong { font-size: 15px; }

    @media (max-width: 760px) {
      .topbar { display: block; }
      .jsonLink { margin-top: 12px; }
      .controls, .summary, .cityGrid { grid-template-columns: 1fr; }
      .stationRow { grid-template-columns: 82px repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>Yakit Fiyatlari</h1>
        <p id="statusText">Veriler yukleniyor...</p>
      </div>
      <a class="jsonLink" href="https://trgref.github.io/yakit/data/latest.json">JSON</a>
    </header>

    <section class="controls" aria-label="Filtreler">
      <label>
        Il ara
        <input id="citySearch" type="search" placeholder="ankara, izmir, istanbul">
      </label>

      <label>
        Istasyon
        <select id="stationFilter">
          <option value="all">Tum istasyonlar</option>
          <option value="opet">Opet</option>
          <option value="shell">Shell</option>
          <option value="po">Petrol Ofisi</option>
          <option value="aytemiz">Aytemiz</option>
        </select>
      </label>

      <button id="clearFilters" type="button">Temizle</button>
    </section>

    <section class="summary" aria-label="Ozet">
      <div>
        <strong id="cityCount">0</strong>
        <span>Il / bolge</span>
      </div>
      <div>
        <strong id="stationCount">0</strong>
        <span>Istasyon kaydi</span>
      </div>
      <div>
        <strong id="errorCount">0</strong>
        <span>Hata</span>
      </div>
    </section>

    <section id="errorBox" class="notice" hidden></section>
    <section id="emptyBox" class="notice" hidden>Bu filtreyle kayit bulunamadi.</section>
    <section id="cityGrid" class="cityGrid" aria-live="polite"></section>
  </main>

  <script>
    const DATA_URL = 'https://trgref.github.io/yakit/data/latest.json';
    const STATIONS = {
      opet: 'Opet',
      shell: 'Shell',
      po: 'Petrol Ofisi',
      aytemiz: 'Aytemiz'
    };

    const state = {
      payload: null,
      search: '',
      station: 'all'
    };

    const elements = {
      statusText: document.querySelector('#statusText'),
      citySearch: document.querySelector('#citySearch'),
      stationFilter: document.querySelector('#stationFilter'),
      clearFilters: document.querySelector('#clearFilters'),
      cityCount: document.querySelector('#cityCount'),
      stationCount: document.querySelector('#stationCount'),
      errorCount: document.querySelector('#errorCount'),
      errorBox: document.querySelector('#errorBox'),
      emptyBox: document.querySelector('#emptyBox'),
      cityGrid: document.querySelector('#cityGrid')
    };

    elements.citySearch.addEventListener('input', () => {
      state.search = elements.citySearch.value.trim().toLocaleLowerCase('tr-TR');
      render();
    });

    elements.stationFilter.addEventListener('change', () => {
      state.station = elements.stationFilter.value;
      render();
    });

    elements.clearFilters.addEventListener('click', () => {
      state.search = '';
      state.station = 'all';
      elements.citySearch.value = '';
      elements.stationFilter.value = 'all';
      render();
    });

    loadData();

    async function loadData() {
      try {
        const response = await fetch(noCacheUrl(DATA_URL), {
          cache: 'no-store',
          headers: {
            pragma: 'no-cache',
            'cache-control': 'no-cache'
          }
        });

        if (!response.ok) {
          throw new Error(`JSON okunamadi: HTTP ${response.status}`);
        }

        state.payload = await response.json();
        render();
      } catch (error) {
        elements.statusText.textContent = 'Veri yuklenemedi.';
        elements.errorBox.hidden = false;
        elements.errorBox.textContent = error instanceof Error ? error.message : String(error);
      }
    }

    function noCacheUrl(url) {
      const parsed = new URL(url, window.location.href);
      parsed.searchParams.set('_', Date.now().toString());
      return parsed.toString();
    }

    function render() {
      const payload = state.payload;

      if (!payload) {
        return;
      }

      const cities = Array.isArray(payload.cities) ? payload.cities : [];
      const filtered = cities.filter((city) => {
        const cityName = String(city.il || '');
        return cityName.toLocaleLowerCase('tr-TR').includes(state.search);
      });

      const stationKeys = state.station === 'all' ? Object.keys(STATIONS) : [state.station];
      const stationCount = filtered.reduce((total, city) => {
        return total + stationKeys.filter((key) => hasAnyPrice(city.stations?.[key])).length;
      }, 0);

      elements.statusText.textContent = statusLine(payload);
      elements.cityCount.textContent = String(filtered.length);
      elements.stationCount.textContent = String(stationCount);
      elements.errorCount.textContent = String(payload.summary?.errors?.length || 0);
      elements.emptyBox.hidden = filtered.length > 0;

      renderErrors(payload.summary?.errors || []);
      elements.cityGrid.replaceChildren(...filtered.map((city) => cityCard(city, stationKeys)));
    }

    function statusLine(payload) {
      if (!payload.fetched_at) {
        return 'Henuz veri cekilmedi.';
      }

      const date = new Date(payload.fetched_at);
      const formatted = Number.isNaN(date.getTime())
        ? payload.fetched_at
        : new Intl.DateTimeFormat('tr-TR', {
          dateStyle: 'medium',
          timeStyle: 'short'
        }).format(date);

      return `Son guncelleme: ${formatted}`;
    }

    function renderErrors(errors) {
      if (errors.length === 0) {
        elements.errorBox.hidden = true;
        elements.errorBox.textContent = '';
        return;
      }

      elements.errorBox.hidden = false;
      elements.errorBox.textContent = `${errors.length} sehir cekilemedi. JSON dosyasinda detay var.`;
    }

    function cityCard(city, stationKeys) {
      const section = document.createElement('section');
      section.className = 'cityCard';

      const header = document.createElement('div');
      header.className = 'cityHead';

      const title = document.createElement('h2');
      title.textContent = titleCase(String(city.il || '-'));

      header.append(title);
      section.append(header);

      for (const key of stationKeys) {
        section.append(stationRow(key, city.stations?.[key]));
      }

      return section;
    }

    function stationRow(key, station) {
      const row = document.createElement('div');
      row.className = 'stationRow';

      const name = document.createElement('strong');
      name.className = 'stationName';
      name.textContent = STATIONS[key] || key;

      row.append(
        name,
        priceCell('Benzin', station?.benzin),
        priceCell('Dizel', station?.dizel),
        priceCell('LPG', station?.lpg)
      );

      return row;
    }

    function priceCell(label, value) {
      const cell = document.createElement('div');
      cell.className = 'priceCell';

      const small = document.createElement('span');
      small.textContent = label;

      const strong = document.createElement('strong');
      strong.textContent = formatPrice(value);

      cell.append(small, strong);
      return cell;
    }

    function formatPrice(value) {
      if (value === null || value === undefined || value === '') {
        return '-';
      }

      const number = Number(value);
      if (!Number.isFinite(number)) {
        return '-';
      }

      return new Intl.NumberFormat('tr-TR', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(number);
    }

    function hasAnyPrice(station) {
      return station && Object.values(station).some((value) => value !== null && value !== undefined);
    }

    function titleCase(value) {
      return value
        .split('-')
        .filter(Boolean)
        .map((part) => part.charAt(0).toLocaleUpperCase('tr-TR') + part.slice(1))
        .join(' ');
    }
  </script>
</body>
</html>
